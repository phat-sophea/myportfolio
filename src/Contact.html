<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header class="navbar">
  <div class="logo">MyPortfolio</div>
  <nav class="nav-links">
    <a href="Home.html">Home</a>
    <a href="About.html">About</a>
    <a href="Contact.html" class="btn-nav active">Contact</a>
  </nav>
</header>
    <!-- Contact Section -->
<section id="contact" class="contact">
  <div class="contact-container">
    
    <div class="contact-info">
      <h2>Let's Work Together</h2>
      <p>Have a project in mind or want to collaborate? Feel free to reach out to me through the form or my contact details.</p>
      
      <div class="info-item">
        <strong>Email:</strong> phatchiiphea@gmail.com
      </div>
      <div class="info-item">
        <strong>Location:</strong> Siem Reap, Cambodia
      </div>
    </div>

    <!-- Contact Form -->
    <form class="contact-form" action="#" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="btn-primary btn-submit">Send Message</button>
    </form>

  </div>
</section>
</body>
</html>
